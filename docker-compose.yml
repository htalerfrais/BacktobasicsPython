services:

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-backtobasics}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        i=0
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" 2>/dev/null; do
          i=$$((i+1)); [ $$i -gt 60 ] && exit 1; sleep 1;
        done
        mc mb "local/$$MINIO_BUCKET" --ignore-existing
    restart: "no"

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"

  api:
    build: . # build l'image du dockerfile local
    env_file:
      - .env
    command: uvicorn src.main:app --host 0.0.0.0 --port 5000 --reload
    ports:
      - "5000:5000"
    volumes:
      - ./project:/app/project
      - ./uploads:/app/uploads  # bind mount: un seul dossier uploads à la racine du repo
    depends_on:
      redis:
        condition: service_started
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  worker:
    build: .
    env_file:
      - .env
    # -E pour publier evenements
    command: celery -A src.infrastructure.celery.celery_app worker --loglevel=info -E
    volumes:
      - ./project:/app/project
      - ./uploads:/app/uploads  # bind mount: un seul dossier uploads à la racine du repo
    depends_on:
      redis:
        condition: service_started
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  flower:
    build: .
    env_file:
      - .env
    command: celery -A src.infrastructure.celery.celery_app flower --port=5555 --db= --persistent=False
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - worker

volumes:
  minio_data:
