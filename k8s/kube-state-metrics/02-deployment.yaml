apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: backtobasics
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: backtobasics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.13.0
          ports:
            - name: http-metrics
              containerPort: 8080
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
