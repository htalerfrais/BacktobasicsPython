apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: backtobasics
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: backtobasics
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
      nodePort: 30900
