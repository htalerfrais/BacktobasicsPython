apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: backtobasics
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: backtobasics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            # monte la clé prometheus.yml du ConfigMap dans le fichier attendu par Prometheus
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: config
          configMap:
            name: backtobasics-prometheus-config
