apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: backtobasics
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: backtobasics
spec:
  # 1 replica pour commencer — scale-out via `kubectl scale` ou HPA/KEDA plus tard
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      containers:
        - name: worker
          image: backtobasics:latest
          imagePullPolicy: Never
          command:
            - sh
            - -c
            - |
              mkdir -p /tmp/prometheus_multiproc
              celery -A src.infrastructure.celery.celery_app worker \
                --loglevel=info -E --concurrency=1
          ports:
            - name: metrics
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: backtobasics-config
            - secretRef:
                name: backtobasics-minio
          resources:
            requests:
              # PyTorch CPU est lourd : on alloue assez pour ne pas crasher sur un nœud Minikube
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
