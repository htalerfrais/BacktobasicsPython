# ClusterIP : le port metrics (8000) n'est accessible qu'en interne (Prometheus dans le cluster).
# Pas besoin de NodePort car les humains ne consultent pas ce port directement.
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: backtobasics
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: backtobasics
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: worker
  ports:
    - name: metrics
      port: 8000
      targetPort: metrics
