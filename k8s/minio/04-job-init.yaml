# Après 02-deployment Ready. Re-run: supprimer le Job puis re-apply
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: backtobasics
  labels:
    app.kubernetes.io/name: minio-init
    app.kubernetes.io/part-of: backtobasics
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:latest
          envFrom:
            - configMapRef:
                name: backtobasics-config
            - secretRef:
                name: backtobasics-minio
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              i=0
              until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" 2>/dev/null; do
                i=$((i+1))
                if [ "$i" -gt 120 ]; then
                  echo "MinIO not reachable in time"
                  exit 1
                fi
                sleep 1
              done
              mc mb "local/${MINIO_BUCKET}" --ignore-existing
              echo "Bucket ${MINIO_BUCKET} OK"
