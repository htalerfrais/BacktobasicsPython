apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: backtobasics
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: backtobasics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            # données persistantes (sessions, DB Grafana)
            - name: data
              mountPath: /var/lib/grafana
            # datasource provisionné au démarrage
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasource.yml
              subPath: datasource.yml
            # dashboard provider (indique à Grafana où lire les JSON)
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
              subPath: dashboards.yml
            # JSON du dashboard (dossier lu par le provider)
            - name: provisioning
              mountPath: /var/lib/grafana/dashboards/backtobasics.json
              subPath: backtobasics.json
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: provisioning
          configMap:
            name: grafana-provisioning
