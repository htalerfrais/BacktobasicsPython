apiVersion: apps/v1
kind: Deployment
metadata:
  name: flower
  namespace: backtobasics
  labels:
    app.kubernetes.io/name: flower
    app.kubernetes.io/part-of: backtobasics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flower
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flower
    spec:
      containers:
        - name: flower
          image: backtobasics:latest
          imagePullPolicy: Never
          command:
            - celery
            - -A
            - src.infrastructure.celery.celery_app
            - flower
            - --port=5555
            - --db=
            - --persistent=False
          ports:
            - name: http
              containerPort: 5555
          envFrom:
            - configMapRef:
                name: backtobasics-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
