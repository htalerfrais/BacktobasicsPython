apiVersion: v1
kind: ConfigMap
metadata:
  name: backtobasics-prometheus-config
  namespace: backtobasics
  labels:
    app.kubernetes.io/name: backtobasics
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'fastapi'
        static_configs:
          - targets: ['api:5000']

      - job_name: 'celery-worker'
        metrics_path: /metrics
        static_configs:
          - targets: ['worker:8000']
